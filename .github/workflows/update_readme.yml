name: Update README everyday

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "03 4 * * *"

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild README.md
        run: node index.js
      - name: Redraw the contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            images/snake.svg
            images/snake-dark.svg?palette=github-dark
      - name: commit changes
        uses: EndBug/add-and-commit@v4
        with:
          author_name: Romain C.
          author_email: 49529524+Ngopimas@users.noreply.github.com
          force: false
          signoff: false
          message: ":memo: README.md updated by a bot"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
