name: Update README everyday

on:
  workflow_dispatch:
  schedule:
    - cron: "03 4 * * *"

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild README.md
        run: node index.js
      - name: Redraw the contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            images/snake.svg
            images/snake-dark.svg?palette=github-dark
      # Plain push, never forced: if master moved since checkout, this step fails
      # instead of overwriting it. (Re-running an old run still uses that run's
      # own copy of this file, so prefer "Run workflow" over "Re-run".)
      - name: Commit changes
        run: |
          git config user.name "Romain C."
          git config user.email "49529524+Ngopimas@users.noreply.github.com"
          git add README.md images/snake.svg images/snake-dark.svg
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m ":memo: README.md updated by a bot"
          git push
